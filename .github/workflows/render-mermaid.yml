name: Render Mermaid Diagrams

on:
  push:
    paths:
      - "diagrams/**.mmd"
      - ".github/workflows/render-mermaid.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Render tech-stack.mmd to SVG
        run: |
          mmdc \
            -i diagrams/tech-stack.mmd \
            -o diagrams/tech-stack.svg \
            -b transparent \
            -w 1400

      - name: Commit rendered diagram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagrams/tech-stack.svg
          git diff --staged --quiet || git commit -m "chore: re-render tech stack diagram"
          git push
